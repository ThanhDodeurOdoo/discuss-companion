<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discuss Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-color: #0d1117;
        --card-bg: #161b22;
        --text-primary: #e6edf3;
        --text-secondary: #8b949e;
        --accent-color: #2f81f7;
        --accent-glow: rgba(47, 129, 247, 0.15);
        --border-color: #30363d;
        --success: #238636;
        --error: #f85149;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-primary);
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }

      header {
        padding: 24px;
        border-bottom: 1px solid var(--border-color);
        background: rgba(22, 27, 34, 0.8);
        backdrop-filter: blur(8px);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .status-tag {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.875rem;
        padding: 4px 12px;
        background: var(--accent-glow);
        border: 1px solid var(--accent-color);
        border-radius: 100px;
        color: var(--accent-color);
      }

      .status-dot {
        width: 8px;
        height: 8px;
        background: var(--accent-color);
        border-radius: 50%;
        box-shadow: 0 0 10px var(--accent-color);
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0% { opacity: 1; }
        50% { opacity: 0.4; }
        100% { opacity: 1; }
      }

      main {
        flex: 1;
        display: grid;
        grid-template-columns: 350px 1fr;
        gap: 1px;
        background: var(--border-color);
        overflow: hidden;
      }

      section {
        background: var(--bg-color);
        padding: 24px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .section-header {
        margin-bottom: 20px;
        color: var(--text-secondary);
        font-size: 0.75rem;
        text-transform: uppercase;
        font-weight: 600;
        letter-spacing: 0.05em;
      }

      .settings-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 16px;
      }

      .setting-item {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .setting-label {
        font-size: 0.875rem;
        color: var(--text-secondary);
      }

      .setting-value {
        font-family: 'JetBrains Mono', monospace;
        font-size: 1rem;
        color: var(--accent-color);
        background: rgba(47, 129, 247, 0.1);
        padding: 8px 12px;
        border-radius: 6px;
        border: 1px dashed var(--accent-color);
        text-align: center;
      }

      #log-container {
        flex: 1;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.8125rem;
        overflow-y: auto;
        padding-right: 8px;
      }

      #log-container::-webkit-scrollbar {
        width: 6px;
      }

      #log-container::-webkit-scrollbar-thumb {
        background: var(--border-color);
        border-radius: 3px;
      }

      .log-entry {
        padding: 8px 12px;
        border-radius: 6px;
        margin-bottom: 4px;
        display: flex;
        gap: 12px;
        transition: background 0.2s ease;
      }

      .log-entry:hover {
        background: rgba(255, 255, 255, 0.03);
      }

      .log-ts {
        color: var(--text-secondary);
        flex-shrink: 0;
      }

      .log-type {
        font-weight: 600;
        text-transform: uppercase;
        width: 60px;
        flex-shrink: 0;
      }

      .type-down { color: var(--success); }
      .type-up { color: var(--text-secondary); }
      .type-error { color: var(--error); }

      .log-msg {
        word-break: break-all;
      }

      footer {
        padding: 16px 24px;
        border-top: 1px solid var(--border-color);
        font-size: 0.75rem;
        color: var(--text-secondary);
        display: flex;
        justify-content: space-between;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Odoo Discuss Companion</h1>
      <div class="status-tag">
        <div class="status-dot"></div>
        Active
      </div>
      <div id="extension-status" class="status-tag" style="background: rgba(139, 148, 158, 0.15); border-color: var(--border-color); color: var(--text-secondary);">
        <div class="status-dot" style="background: var(--text-secondary); box-shadow: none; animation: none;"></div>
        Ext. Disconnected
      </div>
    </header>

    <main>
      <section id="settings-section">
        <div class="section-header">Configuration</div>
        <div class="settings-card">
          <div class="setting-item">
            <span class="setting-label">System Permissions</span>
            <div id="permission-status" class="status-tag" style="margin-top: 8px; justify-content: center; background: rgba(248, 81, 73, 0.1); border-color: var(--error); color: var(--error);">
              <div class="status-dot" style="background: var(--error); box-shadow: 0 0 10px var(--error);"></div>
              Accessibility Blocked
            </div>
            <p style="font-size: 0.75rem; color: var(--text-secondary); margin-top: 8px;">
              Required to capture the PTT key system-wide.
            </p>
          </div>
        </div>

        <div class="settings-card">
          <div class="setting-item">
            <span class="setting-label">PTT Key Binding</span>
            <div id="ptt-key-display" class="setting-value">Space (49)</div>
            <button id="update-key-btn" style="margin-top: 12px; width: 100%; padding: 10px; background: var(--accent-color); border: none; color: var(--text-primary); border-radius: 8px; cursor: pointer; font-size: 0.875rem; font-weight: 500;">
              Change Key
            </button>
            <p style="font-size: 0.75rem; color: var(--text-secondary); margin-top: 8px;">
              Press the key to talk system-wide.
            </p>
          </div>
        </div>

        <style>
          .setting-value.recording {
            border-style: solid;
            background: rgba(248, 81, 73, 0.1);
            border-color: var(--error);
            color: var(--error);
            animation: record-pulse 1.5s infinite;
          }

          @keyframes record-pulse {
            0% { opacity: 1; box-shadow: 0 0 0px var(--error); }
            50% { opacity: 0.7; box-shadow: 0 0 10px var(--error); }
            100% { opacity: 1; box-shadow: 0 0 0px var(--error); }
          }
        </style>
        
        <div class="settings-card" style="margin-top: auto;">
          <button id="clear-logs" style="width: 100%; padding: 10px; background: transparent; border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 8px; cursor: pointer; font-size: 0.875rem;">
            Clear Logs
          </button>
        </div>
      </section>

      <section id="logs-section">
        <div class="section-header">Live Events</div>
        <div id="log-container">
        </div>
      </section>
    </main>

    <footer>
      <span>Version 0.2.0</span>
      <span>PROTOTYPE</span>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
