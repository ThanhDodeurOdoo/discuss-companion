name: Release Windows

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build App (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/backend/target
          key: windows-cargo-release-${{ hashFiles('app/backend/Cargo.lock') }}
          restore-keys: |
            windows-cargo-release-

      - name: Install dependencies
        run: npm install

      - name: Build app (.exe)
        run: npx tauri build --config app/backend/tauri.conf.json --bundles nsis

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-bundle
          path: app/backend/target/release/bundle/nsis/*.exe
          if-no-files-found: error
