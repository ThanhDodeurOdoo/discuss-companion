name: Release Debian 13 X11

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build App (Debian 13 X11)
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Install Debian system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            git \
            libayatana-appindicator3-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libssl-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libx11-dev \
            libxtst-dev \
            pkg-config \
            python3 \
            xdg-utils \
            xz-utils
          rm -rf /var/lib/apt/lists/*

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/backend/target
          key: debian-x11-cargo-release-${{ hashFiles('app/backend/Cargo.lock') }}
          restore-keys: |
            debian-x11-cargo-release-

      - name: Install dependencies
        run: npm install

      - name: Build app (X11)
        run: npx tauri build --config app/backend/tauri.conf.json --bundles deb,rpm -- --features x11

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-trixie-x11-bundle
          path: app/backend/target/release/bundle
          if-no-files-found: error
