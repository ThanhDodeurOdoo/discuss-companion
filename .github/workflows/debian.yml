name: Debian (Trixie)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  verify:
    name: Debian Verify
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Install Debian system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            git \
            libayatana-appindicator3-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libssl-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            pkg-config \
            python3 \
            xz-utils
          rm -rf /var/lib/apt/lists/*

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/backend/target
          key: debian-cargo-verify-${{ hashFiles('app/backend/Cargo.lock') }}
          restore-keys: |
            debian-cargo-verify-

      - name: Install dependencies
        run: npm install

      - name: Run verify
        run: npm run verify
