name: Systems

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/backend/target
          key: ${{ runner.os }}-cargo-systems-lint-${{ hashFiles('app/backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-systems-lint-

      - name: Check formatting
        run: cargo fmt --check
        working-directory: app/backend

      - name: Run clippy
        run: cargo clippy -- -D warnings
        working-directory: app/backend

  test:
    name: Tests
    needs: lint
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/backend/target
          key: ${{ runner.os }}-cargo-systems-test-${{ hashFiles('app/backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-systems-test-

      - name: Run rust tests
        run: cargo test --verbose
        working-directory: app/backend
