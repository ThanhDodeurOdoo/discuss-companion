name: Release Extensions

on:
    workflow_dispatch:
        inputs:
            ref:
                description: Branch, tag or commit to build (defaults to the selected branch)
                required: false
                type: string

permissions:
    contents: read

jobs:
    build:
        name: Build Packed Extensions
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref || github.ref }}
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: package.json
                  cache: "npm"
                  cache-dependency-path: package-lock.json

            - name: Install zip
              run: sudo apt-get update && sudo apt-get install -y zip

            - name: Install dependencies
              run: npm ci

            - name: Build packed extensions
              run: npm run build:extension

            - name: Summarize extension builds
              run: |
                  {
                    echo "Source commit: $(git rev-parse HEAD)"
                    node --input-type=module - <<'JS'
                  import { readFileSync } from 'node:fs';
                  for (const browser of ['chrome', 'firefox']) {
                    const manifest = JSON.parse(readFileSync(`extension/dist/${browser}/manifest.json`, 'utf8'));
                    console.log(`${browser}: ${manifest.version}`);
                  }
                  JS
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Upload Chrome extension artifact
              uses: actions/upload-artifact@v4
              with:
                  name: extension-chrome
                  path: extension/dist/chrome.zip
                  if-no-files-found: error

            - name: Upload Firefox extension artifact
              uses: actions/upload-artifact@v4
              with:
                  name: extension-firefox
                  path: extension/dist/firefox.zip
                  if-no-files-found: error
