name: Release App

on:
    push:
        tags:
            - "[0-9]*"
            - "v[0-9]*"

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    preflight:
        name: Check release version
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - name: Validate tag against app manifests
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  python3 - <<'PY'
                  import json
                  import os
                  import re
                  import tomllib

                  tag = os.environ["TAG"]
                  if not re.fullmatch(r"v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag):
                      raise SystemExit("Expected a release tag named X.Y.Z or vX.Y.Z")
                  with open("package.json", encoding="utf-8") as handle:
                      npm_version = json.load(handle)["version"]
                  with open("app/backend/Cargo.toml", "rb") as handle:
                      cargo_version = tomllib.load(handle)["package"]["version"]
                  if tag.removeprefix("v") != npm_version or npm_version != cargo_version:
                      raise SystemExit(f"Version mismatch: tag={tag}, npm={npm_version}, Cargo={cargo_version}")
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
                      handle.write(f"Release {tag} from commit {os.environ['GITHUB_SHA']}\n")
                  PY

    build:
        name: Build ${{ matrix.platform }}
        needs: preflight
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux-x64-x11
                      runner: ubuntu-22.04
                      args: --bundles deb,rpm -- --locked --features x11
                      assets: app/backend/target/release/bundle/deb/*.deb app/backend/target/release/bundle/rpm/*.rpm
                    - platform: windows-x64
                      runner: windows-2022
                      args: --bundles nsis -- --locked
                      assets: app/backend/target/release/bundle/nsis/*.exe
        defaults:
            run:
                shell: bash
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - name: Install Linux system dependencies
              if: runner.os == 'Linux'
              # Tauri's menu support also links libxdo, independently of XRecord hotkeys.
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                    build-essential \
                    libayatana-appindicator3-dev \
                    libssl-dev \
                    libwebkit2gtk-4.1-dev \
                    librsvg2-dev \
                    libx11-dev \
                    libxdo-dev \
                    libxtst-dev \
                    pkg-config \
                    xdg-utils

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: package.json
                  cache: npm

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: 1.92.0

            - name: Cache cargo build
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      app/backend/target
                  key: release-${{ matrix.platform }}-rust-1.92.0-${{ hashFiles('app/backend/Cargo.lock') }}

            - name: Install dependencies
              run: npm ci

            - name: Build installers
              run: npx tauri build --config app/backend/tauri.conf.json ${{ matrix.args }}

            - name: Collect installers
              run: |
                  mkdir release
                  cp ${{ matrix.assets }} release/

            - name: Upload installers
              uses: actions/upload-artifact@v4
              with:
                  name: release-${{ matrix.platform }}
                  path: release/*
                  if-no-files-found: error

    release:
        name: Publish GitHub release
        needs: build
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        steps:
            - name: Download installers
              uses: actions/download-artifact@v4
              with:
                  pattern: release-*
                  merge-multiple: true
                  path: release

            - name: Generate checksums
              working-directory: release
              run: sha256sum -- *.deb *.rpm *.exe > SHA256SUMS

            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  TAG: ${{ github.ref_name }}
              run: |
                  gh release create "$TAG" release/* \
                    --verify-tag \
                    --generate-notes \
                    --title "Discuss Companion $TAG"
